name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Android + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and build
        run: ./gradlew detekt ktlintCheck jvmTest :app-android:assembleDebug :app-desktop:assemble

      - uses: actions/upload-artifact@v7
        with:
          name: shura-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-windows:
    name: Build desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build desktop app
        run: ./gradlew :app-desktop:assemble
